[project]
name = "lpthw-learner"
version = "0.1.0"
description = "Local-only LPTHW + Async/LLM + PyTorch interactive learner (macOS)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
ml = [
  # macOS / Apple Silicon: install from default PyPI (MPS-capable).
  # Do NOT use https://download.pytorch.org/whl/cpu
  "torch>=2.2.0",
  "numpy>=1.26.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = []
